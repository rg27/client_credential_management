<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
  </head>
  <body>

    <div id="loader-overlay" class="loader-overlay hidden">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loader-text" class="loader-text">Loading client credentials…</p>
    </div>

    <main class="widget-card">

      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7.5" cy="15.5" r="4.5"></circle>
              <path d="M10.7 12.3 21 2"></path>
              <path d="m17 6 3 3"></path>
              <path d="m14 9 2 2"></path>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">Client credentials</h1>
            <p class="brand-sub">Portal logins, grouped by company</p>
          </div>
        </div>

        <button type="button" class="icon-btn" id="themeBtn" title="Switch to dark theme" aria-label="Switch to dark theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="themeIcon"></svg>
        </button>
      </header>

      <section class="controls">
        <div class="combo" id="clientCombo">
          <label class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search or pick a client" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="clientMenu" aria-autocomplete="list" aria-label="Search clients">
            <kbd class="search-kbd" id="searchKbd">/</kbd>
            <button type="button" class="search-clear hidden" id="searchClear" aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>
          </label>
          <div class="menu hidden" id="clientMenu" role="listbox" aria-label="Clients"></div>
        </div>

        <div class="dropdown" id="portalDropdown">
          <button type="button" class="select-btn" id="portalBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Filter by credential type">
            <span class="dot dot--all" id="portalDot"></span>
            <span class="select-label" id="portalLabel">All credential types</span>
            <svg class="select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <div class="menu menu--portal hidden" id="portalMenu" role="listbox" aria-label="Credential types"></div>
        </div>

        <div class="controls-end">
          <button type="button" class="icon-btn" id="toggleAllBtn" title="Collapse all companies" aria-label="Collapse all companies">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="toggleAllIcon">
              <path d="m7 15 5 5 5-5"></path>
              <path d="m7 9 5-5 5 5"></path>
            </svg>
          </button>
        </div>
      </section>

      <div class="table-container" id="table-container">
        <table class="report-table">
          <thead>
            <tr>
              <th scope="col">Credential type</th>
              <th scope="col">Username / email</th>
              <th scope="col">Password</th>
              <th scope="col" class="th-actions">Action</th>
              <th scope="col">Created / updated by</th>
              <th scope="col">Notes</th>
            </tr>
          </thead>
          <tbody id="credentials-tbody"></tbody>
        </table>

        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <p class="empty-title" id="empty-title">No credentials found</p>
          <p class="empty-subtitle" id="empty-subtitle">Nothing matches your search or filter.</p>
          <button type="button" class="ghost-btn hidden" id="clearFiltersBtn">Clear search and filters</button>
        </div>
      </div>

      <footer class="statusbar">
        <span id="status-text">Loading…</span>
        <!-- <span class="status-hint" id="status-hint">Press <kbd>/</kbd> to search</span> -->
      </footer>

    </main>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <div class="popup-overlay hidden" id="popup" data-status="">
      <div class="popup-box" role="alertdialog" aria-labelledby="popupTitle" aria-describedby="popupMessage">
        <div id="statusIcon" class="status-icon"></div>
        <h3 id="popupTitle" class="popup-title">Notification</h3>
        <p id="popupMessage" class="popup-message"></p>
        <button type="button" class="close-btn" id="closeBtn" onclick="closeModalPopup()">Close</button>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
